# Temporary Fly.io deploy while Railway deploys are paused (see README, "Temporary deploy on Fly.io").
# One machine only: the database lives in its memory, so a second machine would have its own data and sessions.
app = "CHANGE-ME"  # the name from `fly apps create`
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"  # never sleep: the nightly reset timer needs an always-on machine
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"  # measured: about 1.1 GB resident after startup; 1 GB was OOM-killed in a local test

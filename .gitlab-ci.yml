stages: [scan, test]

variables:
  GIT_DEPTH: "0" # full history, so the secret scan sees every commit

secret-scan:
  stage: scan
  image:
    name: zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
    entrypoint: [""]
  script:
    - gitleaks git --redact --no-banner --verbose .

# Typecheck and unit tests. The scheduling suite needs the partner's mock DB, which is never committed, so it skips here.
test:
  stage: test
  image: node:22.22.0@sha256:20a424ecd1d2064a44e12fe287bf3dae443aab31dc5e0c0cb6c74bef9c78911c
  script:
    - cd web
    - npm ci
    - npm run typecheck
    - npm test

stages: [scan, test]

variables:
  GIT_DEPTH: "0" # full history, so the secret scan sees every commit

secret-scan:
  stage: scan
  image:
    name: zricethezav/gitleaks:v8.28.0
    entrypoint: [""]
  script:
    - gitleaks git --redact --no-banner --verbose .

# Typecheck and unit tests. The scheduling suite needs the partner's mock DB, which is never committed, so it skips here.
test:
  stage: test
  image: node:22
  script:
    - cd web
    - npm ci
    - npm run typecheck
    - npm test
